name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest --cov=custom_components.bm_monitor
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: python scripts/package_release.py

  esphome:
    name: ESPHome proxy examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install esphome==2026.10.1
      - name: Create dummy configuration secrets
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import yaml
          Path("esphome/secrets.yaml").write_text(yaml.safe_dump({
              "wifi_ssid": "test-network",
              "wifi_password": "test-password",
              "battery_proxy_api_key": base64.b64encode(bytes(range(32))).decode(),
          }))
          PY
      - run: esphome config esphome/battery-proxy.yaml
      - run: esphome config esphome/battery-proxy-other-area.yaml

  hassfest:
    name: Home Assistant manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
